# Pre-commit hooks configuration
# See https://pre-commit.com for more information
# To install: pip install pre-commit
# To setup: pre-commit install
# To run manually: pre-commit run --all-files

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace

      - id: end-of-file-fixer
        name: Fix end of files

      - id: check-yaml
        name: Check YAML files

      - id: pretty-format-json
        name: Pretty format JSON files
        args: [--autofix, --no-sort-keys]

      - id: check-json
        name: Check JSON files

      - id: check-xml
        name: Check XML files

      - id: detect-aws-credentials
        name: Detect AWS credentials
        args: [--allow-missing-credentials]

      - id: detect-private-key
        name: Detect private keys

      - id: forbid-submodules
        name: Forbid git submodules

      - id: check-added-large-files
        name: Check for large files
        args: [--maxkb=500]

      - id: check-merge-conflict
        name: Check for merge conflicts

      - id: mixed-line-ending
        name: Check mixed line endings

      - id: no-commit-to-branch
        name: Prevent committing to certain branches
        args: [--branch, prod, --branch, master]

  # Java formatting with Spotless (auto-fix and re-stage)
  - repo: local
    hooks:
      - id: spotless-format-fix
        name: Spotless Format Fix
        entry: hooks/spotless-hook.sh
        language: script
        files: \.java$
        pass_filenames: false
        description: Auto-fix Java code formatting with Spotless and re-stage files

  # Java style checking with Checkstyle (lint-staged style - only staged files)
  - repo: local
    hooks:
      - id: checkstyle
        name: Checkstyle Check
        entry: hooks/checkstyle-hook.sh
        language: script
        files: \.java$
        pass_filenames: false
        description: Check Java code style with Checkstyle (Google Java Style)
